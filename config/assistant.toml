# Facts the server runs with. `assistant knowledge` renders knowledge/generated/self.md from this file,
# so what the assistant says about itself changes in the same commit as the deployment.

active_model = "qwen3.5-4b"
contact_email = "markbarbuto@outlook.com"
system_prompt_tokens = 300

[models."qwen3.5-4b"]
name = "Qwen3.5-4B"
file = "Qwen_Qwen3.5-4B-Q4_0.gguf"
quantization = "Q4_0"
prefix_budget_tokens = 3000

[models."qwen3.5-2b"]
name = "Qwen3.5-2B"
file = "Qwen_Qwen3.5-2B-Q4_0.gguf"
quantization = "Q4_0"
prefix_budget_tokens = 10000

[tokenizer]
url = "https://huggingface.co/Qwen/Qwen3.5-4B/resolve/851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a/tokenizer.json"
sha256 = "5f9e4d4901a92b997e463c1f46055088b6cca5ca61a6522d1b9f64c4bb81cb42"

[runtime]
name = "llama.cpp"
version = "v0.8.0"

[host]
provider = "Oracle Cloud"
shape = "an Ampere A1 virtual machine with 2 ARM cores and 12 GB of memory"

[retrieval]
embedder = "BAAI/bge-small-en-v1.5"
keyword = "BM25"
fusion = "reciprocal rank fusion"
reranker = "a cross-encoder reranker"
embedder_repo = "Qdrant/bge-small-en-v1.5-onnx-Q"
embedder_revision = "aa8f8b060edb00e03bfdd08813a2949946c8ba55"
reranker_repo = "Xenova/ms-marco-MiniLM-L-6-v2"
reranker_revision = "a09144355adeed5f58c8ed011d209bf8ee5a1fec"
# Refuse without calling the model when the query's best embedding similarity to any chunk is below this. Chosen from the `assistant eval retrieval` sweep.
refuse_below = 0.61

[benchmark]
classic_rag_ttft_seconds = 32
cached_ttft_seconds = 5.5
source = "docs/phase0.md"
