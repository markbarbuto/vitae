[project]
name = "vitae"
version = "0.1.0"
description = "Self-hosted assistant that answers questions about Mark Barbuto"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bm25s==0.3.16",
    "fastembed==0.9.1",
    "tokenizers==0.22.1",
]

[project.scripts]
assistant = "vitae.cli:main"

[dependency-groups]
dev = [
    "pytest==8.4.2",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vitae"]

[tool.pytest.ini_options]
testpaths = ["tests"]
