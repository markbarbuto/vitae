# Groups the sections that describe the same thing, such as a job told once by the resume and once by the site.
# Retrieval ranks topics, topic names and keywords are part of every chunk's search text, and focus hints name topics by their short `hint`, or their name when it has none. `assistant golden` fails if a section is in no topic or in two.

[topics."Bio"]
sections = ["about.md#Bio", "site/profile.md#About me"]

